# Publicerar spelet på GitHub Pages.
# Körs automatiskt vid varje push till main:
# bygger spela.html (allt i en fil) och lägger upp den som index.html.
name: Publicera på GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installera beroenden
        run: npm ci

      - name: Bygg enfilsversionen (spela.html)
        run: npm run build:single

      - name: Gör spela.html till startsida
        run: mkdir -p _site && cp spela.html _site/index.html

      - name: Aktivera GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publicera
        id: deployment
        uses: actions/deploy-pages@v4
