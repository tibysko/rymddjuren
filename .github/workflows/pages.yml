# Publishes the game to GitHub Pages.
# Runs automatically on every push to main: builds play.html (everything in a
# single file) and uploads it as index.html, together with the app icons, the
# manifest and the service worker (offline support).
name: Publish to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the single-file version (play.html)
        run: npm run build:single
        env:
          VITE_BUILD_ID: ${{ github.sha }}

      - name: Assemble the site
        run: |
          mkdir -p _site
          cp play.html _site/index.html
          cp public/manifest.webmanifest public/sw.js public/icon-*.png _site/

      - name: Enable GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
